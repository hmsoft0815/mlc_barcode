# UI tests that drive the installed app (eu.mlcgo.mlcbarcode) in the iOS
# simulator — for the README screenshots (task docs:screenshots:ios).
# xcodegen turns this into MLCBarcodeUITests.xcodeproj; the project is
# generated on the Mac for every run and not checked in.
name: MLCBarcodeUITests
options:
  bundleIdPrefix: eu.mlcgo
  deploymentTarget:
    iOS: "17.0"
targets:
  # A UI-test bundle needs a host target; this empty app is never tested —
  # the tests address the real app by its bundle id.
  Host:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.mlcgo.mlcbarcode.uitesthost
      CODE_SIGNING_ALLOWED: "NO"
  Screenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [Screenshots]
    dependencies:
      - target: Host
    settings:
      TEST_TARGET_NAME: Host
      GENERATE_INFOPLIST_FILE: "YES"
      CODE_SIGNING_ALLOWED: "NO"
schemes:
  Screenshots:
    build:
      targets:
        Screenshots: [test]
    test:
      targets: [Screenshots]

id: "mlc-barcode"
name: "MLC Barcode"
version: "1.2.0"
status: "stable"
category: "MCP Tools"
license: "MIT"
platforms: [Windows, macOS, Linux]
slogan_en: "A versatile command-line tool and MCP Server for generating various types of barcodes."
slogan_de: "Ein vielseitiges Kommanodozeilen-Tool und MCP-Server zur Generierung verschiedener Barcode-Typen."

screenshots:
  - "mlc_barcode_mpc3.png"
  - "mlc_barcode_mpc4.png"

spotlight_sections:
  - title_en: "MCP Server Integration"
    title_de: "MCP-Server Integration"
    desc_en: "Seamlessly integrate barcode generation into your AI workflows. The built-in MCP server allows LLMs like Claude to create barcodes directly in the chat."
    desc_de: "Integrieren Sie die Barcode-Generierung nahtlos in Ihre KI-Workflows. Der integrierte MCP-Server ermöglicht es LLMs wie Claude, Barcodes direkt im Chat zu erstellen."
    screenshot: "mlc_barcode_mpc4.png"
    items_en:
      - "Direct integration with Claude Desktop"
      - "Artifact store connection"
      - "Standardized MCP tools"
    items_de:
      - "Direkte Integration in Claude Desktop"
      - "Anbindung an den Artifact-Speicher"
      - "Standardisierte MCP-Tools"
  - title_en: "Fast QR Templates"
    title_de: "Schnelle QR-Vorlagen"
    desc_en: "Generate specialized QR codes for daily tasks with simple CLI flags. No manual formatting required for WiFi, vCards, or Events."
    desc_de: "Erstellen Sie spezialisierte QR-Codes für tägliche Aufgaben mit einfachen CLI-Flags. Keine manuelle Formatierung für WLAN, vCards oder Termine erforderlich."
    screenshot: "qr_wifi.png"
    items_en:
      - "WiFi connection payloads"
      - "vCard 3.0 contact cards"
      - "iCalendar event invitations"
    items_de:
      - "WLAN-Zugangsdaten"
      - "vCard 3.0 Kontaktkarten"
      - "iCalendar Termineinladungen"

features:
  - icon: "qr-code"
    title_en: "Multiple Barcode Types"
    title_de: "Mehrere Barcode-Typen"
    desc_en: "Supports QR, DataMatrix, Code128, Code39, EAN-13, and more."
    desc_de: "Unterstützt QR, DataMatrix, Code128, Code39, EAN-13 und weitere."
  - icon: "image"
    title_en: "SVG & PNG Output"
    title_de: "SVG & PNG Ausgabe"
    desc_en: "Generates scalable vector graphics or standard PNG images."
    desc_de: "Erzeugt skalierbare Vektorgrafiken oder Standard-PNG-Bilder."
  - icon: "server"
    title_en: "MCP Server Integration"
    title_de: "MCP-Server Integration"
    desc_en: "Seamlessly integrates with LLMs like Claude Desktop via MCP."
    desc_de: "Nahtlose Integration mit LLMs wie Claude Desktop über MCP."
  - icon: "wifi"
    title_en: "Structured QR Data"
    title_de: "Strukturierte QR-Daten"
    desc_en: "Built-in templates for WiFi, vCard, and Calendar events."
    desc_de: "Eingebaute Vorlagen für WLAN, vCard und Kalendereinträge."

downloads:
  free: true
  files:
    - os: "Windows"
      arch: "x64"
      label_en: "Windows AMD64"
      label_de: "Windows AMD64"
      file: "https://mlcgo.eu/downloads/mlc-barcode/barcode-windows-amd64.exe"
    - os: "Linux"
      arch: "x86_64"
      label_en: "Linux AMD64"
      label_de: "Linux AMD64"
      file: "https://mlcgo.eu/downloads/mlc-barcode/barcode-linux-amd64"
    - os: "macOS"
      arch: "Apple Silicon"
      label_en: "macOS (Apple Silicon)"
      label_de: "macOS (Apple Silicon)"
      file: "https://mlcgo.eu/downloads/mlc-barcode/barcode-macos-arm64"
    - os: "macOS"
      arch: "Intel"
      label_en: "macOS (Intel)"
      label_de: "macOS (Intel)"
      file: "https://mlcgo.eu/downloads/mlc-barcode/barcode-macos-amd64"

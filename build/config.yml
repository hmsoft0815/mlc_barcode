# Wails v3 build configuration for MLC Barcode
version: '3'

info:
  companyName: "Michael Lechner"
  productName: "MLC Barcode"
  productIdentifier: "eu.mlcgo.mlcbarcode"
  description: "Cross-platform Barcode & QR Code Generator"
  copyright: "Copyright © 2026 Michael Lechner"
  comments: "Barcode & QR Code Generator with batch processing and live preview"
  version: "1.3.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - .mlcai
      - mlcprodweb
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
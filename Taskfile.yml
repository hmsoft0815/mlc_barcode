version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: mlc-barcode
  CLI_BINARY: barcode
  SERVER_BINARY: mcp-barcode-server
  GUI_BINARY: mlc-barcode-gui
  BIN_DIR: bin
  MODULE: github.com/mlcmcp/mlc_barcode
  VERSION:
    sh: cat VERSION
  # Stamped into every binary, so `barcode --version` reports what VERSION
  # says and not the "dev" placeholder in the source.
  LDFLAGS: -X {{.MODULE}}/internal/version.Version={{.VERSION}}
  # Where the product page expects the files.
  VPS_HOST: mlc@mlcgo.eu
  VPS_DIR: /var/www/html/downloads/mlc-barcode
  DROPZONE: /mnt/data2tb/dropzone

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  generate:bindings:
    desc: Generate Wails v3 TypeScript bindings
    cmds:
      - wails3 generate bindings -ts -i

  build:frontend:
    desc: Build the Svelte TypeScript frontend
    dir: frontend
    cmds:
      - pnpm run build

  build:gui:
    desc: Build the Wails v3 desktop GUI for Linux
    deps: [build:frontend]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=1 go build -tags gtk3,production -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.GUI_BINARY}} .

  build:gui:windows:
    desc: Cross-compile the Wails v3 desktop GUI for Windows
    deps: [build:frontend]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -trimpath -ldflags "{{.LDFLAGS}} -w -s -H windowsgui" -o {{.BIN_DIR}}/{{.GUI_BINARY}}-windows-amd64.exe .

  package:windows:
    desc: Build the Windows NSIS setup installer (.exe)
    deps: [build:gui:windows]
    cmds:
      - makensis -V3 -NOCD -DAPP_VERSION={{.VERSION}} -DEXE_SRC={{.BIN_DIR}}/{{.GUI_BINARY}}-windows-amd64.exe build/windows/installer.nsi

  build:
    desc: Build CLI, MCP server, and GUI for this machine
    deps: [build:frontend]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLI_BINARY}} ./cmd/barcode
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.SERVER_BINARY}} ./cmd/mcp-server
      - CGO_ENABLED=1 go build -tags gtk3,production -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.GUI_BINARY}} .

  build:linux:
    desc: Cross-compile CLI and MCP server for Linux amd64
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLI_BINARY}}-linux-amd64 ./cmd/barcode
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.SERVER_BINARY}}-linux-amd64 ./cmd/mcp-server

  build:windows:
    desc: Cross-compile CLI and MCP server for Windows amd64
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLI_BINARY}}-windows-amd64.exe ./cmd/barcode
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.SERVER_BINARY}}-windows-amd64.exe ./cmd/mcp-server

  build:macos:
    desc: Cross-compile CLI and MCP server for macOS, both architectures
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLI_BINARY}}-macos-arm64 ./cmd/barcode
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.SERVER_BINARY}}-macos-arm64 ./cmd/mcp-server
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.CLI_BINARY}}-macos-amd64 ./cmd/barcode
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.SERVER_BINARY}}-macos-amd64 ./cmd/mcp-server

  build:all:
    desc: Cross-compile every published target and installers
    deps: [build:linux, build:windows, build:macos, package:windows, build:gui]

  dev:
    desc: Run the desktop GUI in Wails v3 development mode with live reload
    cmds:
      - wails3 dev -config ./build/config.yml

  dev:gui:
    desc: Build and run the desktop GUI binary locally
    cmds:
      - task: build:gui
      - ./{{.BIN_DIR}}/{{.GUI_BINARY}}

  dev:cli:
    desc: "Build and run the CLI (default: QR code for https://mlcgo.eu, or specify CLI_ARGS)"
    cmds:
      - task: build
      - ./{{.BIN_DIR}}/{{.CLI_BINARY}} {{.CLI_ARGS | default "-type qr -data https://mlcgo.eu"}}

  dev:server:
    desc: Build and run the MCP server
    cmds:
      - task: build
      - ./{{.BIN_DIR}}/{{.SERVER_BINARY}}

  test:
    desc: Run the Go tests
    cmds:
      - go test -tags gtk3 ./...

  check:frontend:
    desc: Run svelte-check for TypeScript and Svelte diagnostics
    dir: frontend
    cmds:
      - pnpm run check

  lint:
    desc: gofmt check, go vet, and svelte-check
    cmds:
      - |
        unformatted=$(gofmt -l . | grep -v '^$' || true)
        if [ -n "$unformatted" ]; then
          echo "gofmt would change:"; echo "$unformatted"; exit 1
        fi
        echo "gofmt: clean"
      - go vet -tags gtk3 ./...
      - task: check:frontend

  semgrep:
    desc: 'Statische Sicherheitsprüfung: Bericht + Kurzfassung + Urteils-Abgleich.'
    preconditions:
      - sh: command -v mlc-semgrep-baseline
        msg: "mlc-semgrep-* fehlen — in mlcintegration einmal `task install-all` laufen lassen."
    cmds:
      - mkdir -p reports
      - semgrep scan --config {{.CONFIG | default "p/golang"}} --jobs 4 --json --quiet --output reports/.semgrep.tmp.json . || true
      - mv reports/.semgrep.tmp.json reports/semgrep.json
      - mlc-semgrep-summary reports/semgrep.json
      - mlc-semgrep-baseline --report reports/semgrep.json --baseline semgrep-baseline.yaml

  semgrep:review:
    desc: 'Neue Befunde zur Beurteilung nachtragen (verdict/reason dann von Hand).'
    cmds:
      - mlc-semgrep-baseline --report reports/semgrep.json --baseline semgrep-baseline.yaml --update

  semgrep:ticket:
    desc: 'Einen als real beurteilten Befund als Backlog-Eintrag filen.'
    cmds:
      - mlc-semgrep-ticket --key {{.KEY}} --rule {{.RULE}} --priority {{.PRIO | default 2}} {{.DRY}}

  semgrep:new:
    desc: 'Nur was seit einem Bezugspunkt hinzukam — bricht ab, für CI.'
    cmds:
      - semgrep scan --config {{.CONFIG | default "p/golang"}} --jobs 4 --baseline-commit {{.SEIT | default "master"}} --error --quiet .

  clean:
    desc: Remove build output and generated images
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf frontend/dist
      - rm -rf reports
      - rm -f ./*.svg ./*.png

  deploy:dropzone:
    desc: "Copy all build artifacts and Windows installer → {{.DROPZONE}}"
    deps: [build:all]
    cmds:
      - mkdir -p {{.DROPZONE}}
      - |
        echo "→ Copying v{{.VERSION}} artifacts to {{.DROPZONE}} ..."
        MISSING=0
        for f in \
          "{{.BIN_DIR}}/{{.CLI_BINARY}}-linux-amd64" \
          "{{.BIN_DIR}}/{{.CLI_BINARY}}-windows-amd64.exe" \
          "{{.BIN_DIR}}/{{.CLI_BINARY}}-macos-arm64" \
          "{{.BIN_DIR}}/{{.CLI_BINARY}}-macos-amd64" \
          "{{.BIN_DIR}}/{{.SERVER_BINARY}}-linux-amd64" \
          "{{.BIN_DIR}}/{{.SERVER_BINARY}}-windows-amd64.exe" \
          "{{.BIN_DIR}}/{{.GUI_BINARY}}" \
          "{{.BIN_DIR}}/{{.GUI_BINARY}}-windows-amd64.exe" \
          "{{.BIN_DIR}}/mlc-barcode-{{.VERSION}}-windows-setup.exe"; do
          if [ -f "$f" ]; then cp "$f" "{{.DROPZONE}}/"; echo "  ✓ $(basename "$f")";
          else echo "  ✗ missing: $f"; MISSING=$((MISSING+1)); fi
        done
        echo "────────────────────────────────────────────"
        echo "  Dropzone: {{.DROPZONE}}"
        ls -lh "{{.DROPZONE}}/mlc-barcode"* 2>/dev/null || true
        echo "────────────────────────────────────────────"
        if [ "$MISSING" -gt 0 ]; then echo "⚠ $MISSING artifact(s) missing"; exit 1; fi

  dev:deploy:
    desc: "Alias for deploy:dropzone"
    cmds:
      - task: deploy:dropzone

  deploy:
    desc: "PUBLISH: upload CLI binaries and Windows installer"
    deps: [build:all]
    cmds:
      - |
        set -e
        for f in {{.CLI_BINARY}}-linux-amd64 {{.CLI_BINARY}}-windows-amd64.exe \
                 {{.CLI_BINARY}}-macos-arm64 {{.CLI_BINARY}}-macos-amd64 \
                 mlc-barcode-{{.VERSION}}-windows-setup.exe; do
          if [ ! -f "{{.BIN_DIR}}/$f" ]; then echo "missing: {{.BIN_DIR}}/$f"; exit 1; fi
        done
        ssh -o BatchMode=yes {{.VPS_HOST}} "mkdir -p {{.VPS_DIR}}"
        rsync -az --timeout=30 -e 'ssh -o BatchMode=yes -o ConnectTimeout=10' \
          {{.BIN_DIR}}/{{.CLI_BINARY}}-linux-amd64 \
          {{.BIN_DIR}}/{{.CLI_BINARY}}-windows-amd64.exe \
          {{.BIN_DIR}}/{{.CLI_BINARY}}-macos-arm64 \
          {{.BIN_DIR}}/{{.CLI_BINARY}}-macos-amd64 \
          {{.BIN_DIR}}/mlc-barcode-{{.VERSION}}-windows-setup.exe \
          {{.VPS_HOST}}:{{.VPS_DIR}}/
        echo "✓ https://mlcgo.eu/downloads/mlc-barcode/"
